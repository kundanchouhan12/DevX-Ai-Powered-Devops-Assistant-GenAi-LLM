services:
  redis:
    image: redis:7-alpine
    container_name: devx-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: devx-backend
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    ports:
      - "5000:5000"

  worker:
    build: ./worker
    container_name: devx-worker
    env_file:
      - ./worker/.env
    depends_on:
      - redis
    command: node worker.js   # 👈 IMPORTANT

  frontend:
    build: ./frontend
    container_name: devx-frontend
    ports:
      "3000:3000"
    depends_on:
      - backend
